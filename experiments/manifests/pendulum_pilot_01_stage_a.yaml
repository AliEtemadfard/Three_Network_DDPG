schema_version: 2
name: pendulum-pilot-01-stage-a
description: Pilot pipeline_smoke on Pendulum-v1; execution-check artifacts only, never scientific evidence.
defaults:
  environment: pendulum_v1
  experiment: ddpg_baseline
training_seeds: [11]
evaluation_seeds: [1001, 1002, 1003, 1004, 1005]
variants:
  - id: ddpg-pipeline-smoke
    algorithm: ddpg
    overrides:
      - experiment.total_steps=2000
      - experiment.warmup_steps=256
      - experiment.batch_size=64
      - experiment.replay_capacity=10000
      - experiment.evaluation_frequency=500
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - algorithm.hidden_layers=[128,128]
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.0003
      - algorithm.critic_one_learning_rate=0.001
      - algorithm.critic_two_learning_rate=0.001
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=null
      - algorithm.actor_update_delay=1
      - algorithm.device=cpu
  - id: ddpg-no-target-actor-pipeline-smoke
    algorithm: ddpg_no_target_actor
    experiment: ddpg_no_target_actor
    overrides:
      - experiment.total_steps=2000
      - experiment.warmup_steps=256
      - experiment.batch_size=64
      - experiment.replay_capacity=10000
      - experiment.evaluation_frequency=500
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - algorithm.hidden_layers=[128,128]
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.0003
      - algorithm.critic_one_learning_rate=0.001
      - algorithm.critic_two_learning_rate=0.001
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=null
      - algorithm.actor_update_delay=1
      - algorithm.device=cpu
  - id: three-network-shared-error-pipeline-smoke
    algorithm: three_network_ddpg
    experiment: three_network_core
    overrides:
      - experiment.total_steps=2000
      - experiment.warmup_steps=256
      - experiment.batch_size=64
      - experiment.replay_capacity=10000
      - experiment.evaluation_frequency=500
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - algorithm.hidden_layers=[128,128]
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.0003
      - algorithm.critic_one_learning_rate=0.001
      - algorithm.critic_two_learning_rate=0.001
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=null
      - algorithm.agreement_mode=none
      - algorithm.alpha=0.0
      - algorithm.alpha_prime=0.0
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
      - algorithm.update_schedule=sequential
      - algorithm.actor_state_source=next
      - algorithm.critic_initialization=independent
      - algorithm.actor_update_delay=1
      - algorithm.guard.validation_batch=false
      - algorithm.device=cpu
execution:
  output_root: runs/pendulum-pilot-01
  workers: 1
analysis:
  last_k: 4
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261001
preregistration:
  stage: pilot
  stage_type: pipeline_smoke
  hypothesis: The local Pendulum pipeline can create complete, auditable artifacts for each implemented variant; no learning claim is tested.
  fixed_factors: [Pendulum-v1, wrappers, action handling, CPU, one worker, training seed, evaluation seeds, pipeline-smoke budget]
  varied_factors: [algorithm]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, current_agreement_error, next_agreement_error, q_absolute_mean]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs]
  failure_and_divergence_rules: Preserve completed, interrupted, failed, divergent, and non_finite statuses; do not drop failed runs from reports.
  stopping_rules: Fixed at 2000 training environment steps per run; no outcome-dependent stopping.
  candidate_selection_rules: No candidate selection is permitted from this pipeline smoke.
