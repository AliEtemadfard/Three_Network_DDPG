schema_version: 2
name: pendulum-shared-d-paired-15k-01
description: Manual-only one-seed advisor reconstruction with aligned board inputs and 10-to-1 or evenly spaced 10-to-2 critic-to-Actor schedules; no convergence claim.
defaults:
  environment: pendulum_v1
  experiment: ddpg_baseline
training_seeds: [11]
evaluation_seeds: [1001, 1002, 1003, 1004, 1005]
variants:
