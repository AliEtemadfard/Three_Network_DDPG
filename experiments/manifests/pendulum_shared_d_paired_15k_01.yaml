execution:
  output_root: runs/pendulum-shared-d-paired-15k-01
  workers: 1
analysis:
  last_k: 10
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261011
preregistration:
  stage: pilot
  stage_type: advisor_paired_shared_d_diagnostic
  hypothesis: Both critics train on aligned current and next views of each transition; a policy update every ten or five critic-pair iterations tests the advisor's slower-policy clarification without replacing shared D by D-prime.
  fixed_factors: [training seed, evaluation seeds, Pendulum-v1, raw observations, no wrappers, reward scale, action scaling, CPU, one worker, architecture, replay, batch size, collection warmup, exploration, evaluation schedule, per-run budget, shared-D equations, positive agreement coefficients, next-state Actor objective, independent critic initialization, no proposed target networks, no beta]
  varied_factors: [DDPG versus paired shared-D, Actor update every ten versus five critic-pair iterations]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, signed_residual_mean, q2_td_squared_error, current_agreement_error, next_agreement_error, q_abs_mean, q_abs_max, y_mean, z_mean, actor_gradient_norm, critic_one_gradient_norm, critic_two_gradient_norm, actor_next_action_utilization_mean, actor_update_applied, actor_update_steps, critic_pair_update_steps, paired_batch_size]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs, incomplete_runs]
  failure_and_divergence_rules: Completed finite runs are not automatically stable; inspect positive Q drift under nonpositive rewards, agreement growth, pre-clip gradient growth, action-bound utilization, and sustained return collapse. D-prime and validation data never drive an update.
  stopping_rules: Fixed 15000 environment steps per run; no automatic extension or parameter tuning. Preserve evidence if the user interrupts a non-finite or clearly exploding run.
  candidate_selection_rules: Inspect full curves and all failures; no best-checkpoint or one-seed superiority claim. The two proposed configurations differ only in Actor frequency. Comparison with the previous screen also changes Actor preparation and is not a frequency-only causal test; DDPG retains its established baseline optimizer rates and targets.
