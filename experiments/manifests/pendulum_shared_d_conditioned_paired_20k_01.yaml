execution:
  output_root: runs/pendulum-shared-d-conditioned-paired-20k-01
  workers: 1
analysis:
  last_k: 10
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261011
preregistration:
  stage: pilot
  stage_type: conditioned_paired_early_signal_screen
  hypothesis: Strong current-input agreement anchors Critic Two to the reward-driven current value while exact row pairing and a slower Actor prevent the positive-Q drift and state-independent action saturation observed in the equal-coefficient paired screen.
  fixed_factors: [training seed, evaluation seeds, Pendulum-v1, raw observations, no wrappers, reward scale, action scaling, CPU, one worker, architecture, replay, batch size, collection warm-up, exploration, evaluation schedule, per-run budget, shared-D equations, asymmetric agreement coefficients, 5000-update critic preparation, next-state Actor objective, independent critic initialization, no proposed target networks, no beta, paired minibatch contract, learning rates, Adam settings, gradient clipping]
  varied_factors: [DDPG versus conditioned paired shared-D, Actor every two versus five versus ten critic-pair iterations]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, signed_residual_mean, q2_td_squared_error, current_agreement_error, next_agreement_error, q_abs_mean, q_abs_max, y_mean, z_mean, z1_mean, actor_gradient_norm, critic_one_gradient_norm, critic_two_gradient_norm, actor_next_action_utilization_mean, actor_update_applied, actor_update_steps, critic_pair_update_steps, paired_batch_size]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs, incomplete_runs]
  failure_and_divergence_rules: Completion and finite values are insufficient; inspect sustained positive Q drift under nonpositive rewards, growth of both agreement errors, pre-clip gradient growth, near-constant action-bound utilization, and sustained return collapse. D-prime and validation data never drive an update.
  stopping_rules: Fixed 20000 environment steps per run. This screen asks only whether useful learning begins and the early failure signature is avoided; do not extend a run automatically. Manually interrupt a proposed run only for non-finite values or unmistakable sustained scale explosion; preserve the attempt as evidence and inspect status before any retry.
  candidate_selection_rules: Compare complete curves, normalized AUC, late-window return, Q calibration, action-state dependence and all failures. Do not select by the best checkpoint or claim superiority from one training seed. The three proposed variants differ only in Actor frequency.
