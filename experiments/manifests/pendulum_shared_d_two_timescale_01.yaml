schema_version: 2
name: pendulum-shared-d-two-timescale-01
description: Manual one-seed comparison of DDPG and the board-faithful shared-D two-timescale hypothesis; development evidence only.
defaults:
  environment: pendulum_v1
  experiment: ddpg_baseline
training_seeds: [11]
evaluation_seeds: [1001, 1002, 1003, 1004, 1005]
variants:
  - id: ddpg
    algorithm: ddpg
    overrides:
      - experiment.total_steps=150000
      - experiment.warmup_steps=1000
      - experiment.batch_size=64
      - experiment.replay_capacity=100000
      - experiment.evaluation_frequency=1000
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - algorithm.hidden_layers=[128,128]
      - algorithm.activation=relu
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.0001
      - algorithm.critic_one_learning_rate=0.0003
      - algorithm.critic_two_learning_rate=0.0003
      - algorithm.optimizer.name=adam
      - algorithm.optimizer.epsilon=0.00000001
      - algorithm.optimizer.weight_decay=0.0
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=10.0
      - algorithm.actor_update_delay=1
      - algorithm.target_networks.actor=true
      - algorithm.target_networks.critic=true
      - algorithm.target_networks.tau=0.005
      - algorithm.device=cpu
  - id: shared-d-two-timescale
    algorithm: three_network_shared_d_two_timescale
    experiment: three_network_core
    overrides:
      - experiment.total_steps=150000
      - experiment.warmup_steps=1000
      - experiment.batch_size=64
      - experiment.replay_capacity=100000
      - experiment.evaluation_frequency=1000
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - algorithm.hidden_layers=[128,128]
      - algorithm.activation=relu
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.0001
      - algorithm.critic_one_learning_rate=0.0003
      - algorithm.critic_two_learning_rate=0.00003
      - algorithm.optimizer.name=adam
      - algorithm.optimizer.epsilon=0.00000001
      - algorithm.optimizer.weight_decay=0.0
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=10.0
      - algorithm.critic_objective=shared_error
      - algorithm.agreement_mode=both
      - algorithm.alpha=0.1
      - algorithm.alpha_prime=0.1
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
      - algorithm.update_schedule=sequential
      - algorithm.actor_state_source=next
      - algorithm.critic_initialization=independent
      - algorithm.critic_two_update_delay=2
      - algorithm.actor_update_delay=2
      - algorithm.actor_learning_starts=5000
      - algorithm.guard.validation_batch=false
      - algorithm.diagnostic_frequency=100
      - algorithm.device=cpu
execution:
  output_root: runs/pendulum-shared-d-two-timescale-01
  workers: 1
analysis:
  last_k: 10
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261008
preregistration:
  stage: pilot
  stage_type: shared_d_two_timescale_correction
  hypothesis: Slower and less frequent Critic Two updates, with a still-slower Actor clock, may control the shared-Q translation mode while preserving the board-defined shared residual and matched-input agreements; one seed cannot establish convergence or superiority.
  fixed_factors: [training seed, evaluation seeds, Pendulum-v1, wrappers, raw observations, reward scale, action scaling, CPU, one worker, architecture, Adam, replay, batch, warmup, exploration, gradient clipping, evaluation schedule, total environment-step budget]
  varied_factors: [algorithm, target networks, critic coupling, critic learning-rate ratio, critic update frequency, actor state source, actor schedule]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, q2_td_squared_error, current_agreement_error, next_agreement_error, q_abs_mean, q_abs_max, actor_gradient_norm, critic_one_gradient_norm, critic_two_gradient_norm, critic_two_update_applied, critic_two_update_steps, actor_update_applied, actor_update_steps]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs, incomplete_runs]
  failure_and_divergence_rules: Completion and finite values are insufficient; reject persistent Q-scale growth, agreement growth, actor saturation, or late return collapse.
  stopping_rules: Fixed at 150000 environment steps per run, with manual interruption permitted for non-finite values or unmistakable sustained scale explosion.
  candidate_selection_rules: Inspect the full return and mechanism curves. Do not select from the best checkpoint or claim convergence or superiority from one seed.
