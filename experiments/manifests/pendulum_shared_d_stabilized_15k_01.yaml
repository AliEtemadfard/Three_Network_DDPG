execution:
  output_root: runs/pendulum-shared-d-stabilized-15k-01
  workers: 1
analysis:
  last_k: 10
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261011
preregistration:
  stage: pilot
  stage_type: shared_d_stability_diagnostic
  hypothesis: Conservative optimizer clocks should prevent early Actor saturation; same-snapshot critic gradients test whether sequential stale-output coupling drives shared-D drift; current-state Actor input tests replay-distribution mismatch without changing either critic equation.
  fixed_factors: [training seed, evaluation seeds, Pendulum-v1, wrappers, raw observations, reward scale, action scaling, CPU, one worker, architecture, replay, batch, collection warmup, exploration, evaluation schedule, total environment-step budget, shared-D equations, agreement coefficients, independent critic initialization, no target networks for proposed variants]
  varied_factors: [baseline versus shared-D, sequential versus synchronous critic snapshot, current versus next Actor state]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, q2_td_squared_error, current_agreement_error, next_agreement_error, q_abs_mean, q_abs_max, actor_gradient_norm, critic_one_gradient_norm, critic_two_gradient_norm, actor_current_action_utilization_mean, actor_next_action_utilization_mean, critic_snapshot_synchronous, actor_update_applied, actor_update_steps]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs, incomplete_runs]
  failure_and_divergence_rules: Completion and finite values are insufficient; reject persistent Q-scale growth, agreement growth, sustained pre-clip gradient growth, action-bound collapse, or return collapse. The Q2 residual is diagnostic only and is not optimized.
  stopping_rules: Fixed at 15000 environment steps per run. Manually interrupt only a run with non-finite metrics or unmistakable sustained scale explosion; retain its failure evidence.
  candidate_selection_rules: Compare complete curves and DDPG, not one checkpoint. Do not choose a candidate solely by final return. One seed cannot establish convergence or superiority.
