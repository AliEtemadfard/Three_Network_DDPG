execution:
  output_root: runs/pendulum-shared-d-optimizer-scale-10k-01
  workers: 1
analysis:
  last_k: 5
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261012
preregistration:
  stage: pilot
  stage_type: paired_shared_d_optimizer_scale_screen
  hypothesis: Lowering the Actor learning rate improved late checkpoints but did not improve normalized AUC, while critic gradients remained orders of magnitude larger than DDPG. Reducing both critic Adam step sizes may improve critic-policy tracking; the second variant preserves the 10-to-1 critic-to-Actor learning-rate ratio to distinguish a critic-only reduction from a uniform optimizer slowdown.
  fixed_factors: [training seed, evaluation seeds, Pendulum-v1, raw rewards, raw observations, no wrappers, action scaling, CPU, one worker, architecture, replay, batch size, collection warm-up, exploration, evaluation schedule, per-run budget, shared-D equations, alpha, alpha-prime, immediate Actor start, Actor update delay, next-state Actor objective, independent critic initialization, no proposed target networks, no beta, paired minibatch contract, Q2-Q1-Actor order, equal critic learning rates, Adam settings, gradient clipping, truncation bootstrap policy]
  varied_factors: [Actor learning rate 3e-5 versus 1e-5 with both critic learning rates fixed at 1e-4]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, signed_residual_mean, q2_td_squared_error, current_agreement_error, next_agreement_error, q_abs_mean, q_abs_max, y_mean, z_mean, z1_mean, actor_gradient_norm, critic_one_gradient_norm, critic_two_gradient_norm, actor_current_action_utilization_mean, actor_next_action_utilization_mean, actor_update_applied, actor_update_steps, critic_pair_update_steps, paired_batch_size]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs, incomplete_runs]
  failure_and_divergence_rules: Completion and finite values are insufficient. Reject a variant if it does not improve over several consecutive checkpoints, if a gain collapses before 10000 steps, or if Q scale, action utilization, and pre-clip gradients continue to oscillate without return improvement.
  stopping_rules: Fixed 10000 environment steps per run. Do not extend or resume a completed unstable run. Preserve interrupted attempts as evidence.
  candidate_selection_rules: Compare against the completed critics-3e-4 Actor-3e-5 delay-10 run and raw DDPG. The first variant isolates lower critic step sizes; the second then isolates an additional Actor slowdown. Do not select by the best single checkpoint or transfer to another environment unless late-window return, normalized AUC, and reliability diagnostics all improve.
