schema_version: 2
name: pendulum-shared-d-optimizer-scale-10k-01
description: Manual-only one-seed optimizer-timescale screen that keeps the paired shared-D equations and best late Actor schedule fixed while reducing both critic learning rates, with and without a matched Actor reduction.
defaults:
  environment: pendulum_v1
  experiment: three_network_core
training_seeds: [11]
evaluation_seeds: [1001, 1002, 1003, 1004, 1005]
variants:
  - id: critics-1e-4-actor-3e-5
    algorithm: three_network_shared_d_paired
    overrides:
      - experiment.total_steps=10000
      - experiment.warmup_steps=1000
      - experiment.batch_size=64
      - experiment.replay_capacity=100000
      - experiment.evaluation_frequency=500
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - environment.reward_scale=1.0
      - algorithm.hidden_layers=[128,128]
      - algorithm.activation=relu
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.00003
      - algorithm.critic_one_learning_rate=0.0001
      - algorithm.critic_two_learning_rate=0.0001
      - algorithm.optimizer.name=adam
      - algorithm.optimizer.epsilon=0.00000001
      - algorithm.optimizer.weight_decay=0.0
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=10.0
      - algorithm.critic_objective=shared_error
      - algorithm.agreement_mode=both
      - algorithm.alpha=0.01
      - algorithm.alpha_prime=10.0
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
      - algorithm.update_schedule=sequential
      - algorithm.actor_state_source=next
      - algorithm.critic_initialization=independent
      - algorithm.paired_batch_contract=board_aligned_v1
      - algorithm.actor_update_delay=10
      - algorithm.actor_learning_starts=0
      - algorithm.guard.validation_batch=false
      - algorithm.diagnostic_frequency=100
      - algorithm.device=cpu

  - id: critics-1e-4-actor-1e-5
    algorithm: three_network_shared_d_paired
    overrides:
      - experiment.total_steps=10000
      - experiment.warmup_steps=1000
      - experiment.batch_size=64
      - experiment.replay_capacity=100000
      - experiment.evaluation_frequency=500
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - environment.reward_scale=1.0
      - algorithm.hidden_layers=[128,128]
      - algorithm.activation=relu
      - algorithm.gamma=0.99
