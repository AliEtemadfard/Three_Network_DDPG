execution:
  output_root: runs/pendulum-shared-d-local-tuning-10k-01
  workers: 1
analysis:
  last_k: 5
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261013
preregistration:
  stage: pilot
  stage_type: paired_shared_d_local_hyperparameter_screen
  hypothesis: Noise 0.3 corrected the strongly one-sided final Q2 action-gradient profile and modestly improved late return without improving normalized AUC. A bounded local comparison can determine whether the useful region lies below or above 0.3 and whether a slightly faster Actor converts the improved action ranking into earlier control learning.
  fixed_factors: [training seed, evaluation seeds, Pendulum-v1, raw rewards, raw observations, no wrappers, action scaling, CPU, one worker, architecture, replay, batch size, collection warm-up, evaluation schedule, per-run budget, shared-D equations, alpha, alpha-prime, immediate Actor start, Actor update delay, next-state Actor objective, independent critic initialization, no proposed target networks, no beta, paired minibatch contract, Q2-Q1-Actor order, equal critic learning rates, Adam settings, gradient clipping, truncation bootstrap policy]
  varied_factors: [Gaussian exploration standard deviation 0.2 or 0.4 at Actor learning rate 3e-5, and Actor learning rate 5e-5 at Gaussian exploration standard deviation 0.3]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, signed_residual_mean, q2_td_squared_error, current_agreement_error, next_agreement_error, q_abs_mean, q_abs_max, y_mean, z_mean, z1_mean, actor_gradient_norm, critic_one_gradient_norm, critic_two_gradient_norm, actor_current_action_utilization_mean, actor_next_action_utilization_mean, actor_update_applied, actor_update_steps, critic_pair_update_steps, paired_batch_size]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs, incomplete_runs]
  failure_and_divergence_rules: Completion and finite values are insufficient. Reject variants whose return does not improve over several consecutive checkpoints, whose apparent gain collapses before 10000 steps, or whose broader exploration or faster Actor increases Q scale, gradients, or action saturation without persistent return improvement.
  stopping_rules: Fixed 10000 environment steps per run. Do not extend or resume a completed unstable run. Preserve interrupted attempts as evidence. Do not add further grid points after observing these outcomes.
  candidate_selection_rules: Compare against the completed noise-0.1 and noise-0.3 Actor-3e-5 references and raw DDPG. Rank by normalized AUC first, last-five evaluation mean second, and mechanism reliability third. Inspect the final action profile. A single best checkpoint cannot select a candidate, and this one-seed development screen cannot establish global best parameters or superiority.
