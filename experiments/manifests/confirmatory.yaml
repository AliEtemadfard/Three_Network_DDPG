schema_version: 2
name: confirmatory-example
description: Reviewable example; execution requires an approved frozen experiment plan.
defaults:
  environment: pendulum_v1
  experiment: ddpg_baseline
training_seeds: [101, 202, 303, 404, 505, 606, 707, 808, 909, 1010]
evaluation_seeds: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010]
variants:
  - id: ddpg
    algorithm: ddpg
    overrides:
      - experiment.total_steps=500000
      - experiment.warmup_steps=1000
      - experiment.evaluation_frequency=5000
      - experiment.evaluation_episodes=10
  - id: ddpg-no-target-actor
    algorithm: ddpg_no_target_actor
    experiment: ddpg_no_target_actor
    overrides:
      - experiment.total_steps=500000
      - experiment.warmup_steps=1000
      - experiment.evaluation_frequency=5000
      - experiment.evaluation_episodes=10
  - id: three-network-shared-error
    algorithm: three_network_ddpg
    experiment: three_network_core
    overrides:
      - experiment.total_steps=500000
      - experiment.warmup_steps=1000
      - experiment.evaluation_frequency=5000
      - experiment.evaluation_episodes=10
      - algorithm.agreement_mode=none
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
  - id: three-network-current-agreement
    algorithm: three_network_ddpg
    experiment: three_network_core
    overrides:
      - experiment.total_steps=500000
      - experiment.warmup_steps=1000
      - experiment.evaluation_frequency=5000
      - experiment.evaluation_episodes=10
      - algorithm.agreement_mode=current
      - algorithm.alpha=0.0
      - algorithm.alpha_prime=0.1
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
  - id: three-network-next-agreement
    algorithm: three_network_ddpg
    experiment: three_network_core
    overrides:
      - experiment.total_steps=500000
      - experiment.warmup_steps=1000
      - experiment.evaluation_frequency=5000
      - experiment.evaluation_episodes=10
      - algorithm.agreement_mode=next
      - algorithm.alpha=0.1
      - algorithm.alpha_prime=0.0
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
  - id: three-network-both-agreements
    algorithm: three_network_ddpg
    experiment: three_network_core
    overrides:
      - experiment.total_steps=500000
      - experiment.warmup_steps=1000
      - experiment.evaluation_frequency=5000
      - experiment.evaluation_episodes=10
      - algorithm.agreement_mode=both
      - algorithm.alpha=0.1
      - algorithm.alpha_prime=0.1
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
  - id: three-network-guarded
    algorithm: three_network_ddpg
    experiment: three_network_core
    overrides:
      - experiment.total_steps=500000
      - experiment.warmup_steps=1000
      - experiment.evaluation_frequency=5000
      - experiment.evaluation_episodes=10
      - algorithm.agreement_mode=none
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
      - algorithm.update_schedule=guarded
      - algorithm.guard.scope=joint
      - algorithm.guard.tolerance=0.0
      - algorithm.guard.backtracking_factor=0.5
      - algorithm.guard.maximum_retries=5
      - algorithm.guard.minimum_learning_rate=0.000001
      - algorithm.guard.validation_batch=true
execution:
  output_root: runs/protocol-v2
  workers: 1
analysis:
  last_k: 10
  bootstrap_samples: 10000
  confidence_level: 0.95
  bootstrap_seed: 20260930
preregistration:
  hypothesis: Must be replaced and approved before execution.
  fixed_factors: [environment, network sizes, optimizers, budget, evaluation seeds]
  varied_factors: [algorithm]
  primary_metrics: [evaluation_return_mean, final_return_last_k, normalized_auc]
  mechanism_metrics: [shared_squared_error, signed_residual_mean, absolute_residual_mean]
  failure_and_divergence_rules: Non-finite metrics are non_finite; numerical divergence is divergent; all failures remain in reports.
  stopping_rules: Fixed environment-step budget; no outcome-dependent stopping.
  candidate_selection_rules: Must be approved before examining confirmatory outcomes.
