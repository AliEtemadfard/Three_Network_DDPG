execution:
  output_root: runs/pendulum-shared-d-board-20k-01
  workers: 1
analysis:
  last_k: 10
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261010
preregistration:
  stage: pilot
  stage_type: board_shared_d_reconstruction_screen
  hypothesis: Updating both critics on every shared minibatch in the board order removes the rejected Q2 clock mismatch; actor-only warm-up and identical-value but independently parameterized critics test the two remaining early-instability mechanisms without changing the equations.
  fixed_factors: [training seed, evaluation seeds, Pendulum-v1, wrappers, raw observations, reward scale, action scaling, CPU, one worker, architecture, Adam, critic learning rates, actor learning rate, replay, batch, collection warmup, exploration, gradient clipping, evaluation schedule, total environment-step budget, shared-D equations, agreement coefficients, update order]
  varied_factors: [algorithm, target networks, actor learning start, critic initialization]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, q2_td_squared_error, current_agreement_error, next_agreement_error, q_abs_mean, q_abs_max, actor_gradient_norm, critic_one_gradient_norm, critic_two_gradient_norm, critic_two_update_applied, critic_two_update_steps, actor_update_applied, actor_update_steps]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs, incomplete_runs]
  failure_and_divergence_rules: Completion and finite values are insufficient; reject persistent Q-scale growth, agreement growth, one-sided action saturation, or return collapse.
  stopping_rules: Fixed at 20000 environment steps per run. Manual interruption is permitted only for non-finite values or unmistakable sustained scale explosion.
  candidate_selection_rules: Compare complete curves, not one checkpoint. This one-seed screen cannot establish convergence or superiority.
