schema_version: 2
name: pendulum-separate-td-screening-01
description: Manual Pendulum-v1 screening of the opt-in separate_td reconstruction; development evidence only.
defaults:
  environment: pendulum_v1
  experiment: ddpg_baseline
training_seeds: [11]
evaluation_seeds: [1001, 1002, 1003, 1004, 1005]
variants:
  - id: ddpg
    algorithm: ddpg
    overrides:
      - experiment.total_steps=5000
      - experiment.warmup_steps=256
      - experiment.batch_size=64
      - experiment.replay_capacity=10000
      - experiment.evaluation_frequency=500
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - algorithm.hidden_layers=[128,128]
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.0003
      - algorithm.critic_one_learning_rate=0.001
      - algorithm.critic_two_learning_rate=0.001
      - algorithm.optimizer.name=adam
      - algorithm.optimizer.epsilon=0.00000001
      - algorithm.optimizer.weight_decay=0.0
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=null
      - algorithm.actor_update_delay=1
      - algorithm.device=cpu
  - id: three-network-shared-error
    algorithm: three_network_ddpg
    experiment: three_network_core
    overrides:
      - experiment.total_steps=5000
      - experiment.warmup_steps=256
      - experiment.batch_size=64
      - experiment.replay_capacity=10000
      - experiment.evaluation_frequency=500
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - algorithm.hidden_layers=[128,128]
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.0003
      - algorithm.critic_one_learning_rate=0.001
      - algorithm.critic_two_learning_rate=0.001
      - algorithm.optimizer.name=adam
      - algorithm.optimizer.epsilon=0.00000001
      - algorithm.optimizer.weight_decay=0.0
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=null
      - algorithm.critic_objective=shared_error
      - algorithm.agreement_mode=both
      - algorithm.alpha=0.1
      - algorithm.alpha_prime=0.1
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
      - algorithm.update_schedule=sequential
      - algorithm.actor_state_source=next
      - algorithm.critic_initialization=independent
      - algorithm.actor_update_delay=1
      - algorithm.guard.validation_batch=false
      - algorithm.diagnostic_frequency=100
      - algorithm.device=cpu
  - id: three-network-separate-td
    algorithm: three_network_ddpg
    experiment: three_network_core
    overrides:
      - experiment.total_steps=5000
      - experiment.warmup_steps=256
      - experiment.batch_size=64
      - experiment.replay_capacity=10000
      - experiment.evaluation_frequency=500
      - experiment.evaluation_episodes=5
      - experiment.bootstrap_on_truncation=true
      - experiment.clip_actions=true
      - algorithm.hidden_layers=[128,128]
      - algorithm.gamma=0.99
      - algorithm.actor_learning_rate=0.0003
      - algorithm.critic_one_learning_rate=0.001
      - algorithm.critic_two_learning_rate=0.001
      - algorithm.optimizer.name=adam
      - algorithm.optimizer.epsilon=0.00000001
      - algorithm.optimizer.weight_decay=0.0
      - algorithm.exploration_noise.mode=gaussian
      - algorithm.exploration_noise.standard_deviation=0.1
      - algorithm.exploration_noise.clip=null
      - algorithm.action_rescaling=true
      - algorithm.gradient_clip_norm=null
      - algorithm.critic_objective=separate_td
      - algorithm.agreement_mode=both
      - algorithm.alpha=0.1
      - algorithm.alpha_prime=0.1
      - algorithm.beta_regularizer.mode=none
      - algorithm.beta_regularizer.coefficient=0.0
      - algorithm.update_schedule=sequential
      - algorithm.actor_state_source=next
      - algorithm.critic_initialization=independent
      - algorithm.actor_update_delay=1
      - algorithm.guard.validation_batch=false
      - algorithm.diagnostic_frequency=100
      - algorithm.device=cpu
execution:
  output_root: runs/pendulum-separate-td-screening-01
  workers: 1
analysis:
  last_k: 5
  bootstrap_samples: 2000
  confidence_level: 0.95
  bootstrap_seed: 20261006
preregistration:
  stage: pilot
  stage_type: mechanism_screening
  hypothesis: The separate_td reconstruction may bound Q2's current-input TD regression better than the shared-error objective; no superiority or convergence claim is tested.
  fixed_factors: [Pendulum-v1, wrappers, action handling, CPU, one worker, training seed, evaluation seeds, network width, learning rates, replay, warmup, exploration, evaluation schedule, budget, agreement coefficients]
  varied_factors: [algorithm, critic_objective]
  primary_metrics: [evaluation_return_mean, normalized_auc]
  mechanism_metrics: [shared_squared_error, q2_td_squared_error, q2_signed_residual_mean, q2_absolute_residual_mean, current_agreement_error, next_agreement_error, q_abs_mean, q_abs_max, actor_gradient_norm, critic_one_gradient_norm, critic_two_gradient_norm]
  reliability_metrics: [non_finite_runs, divergent_runs, failed_runs, interrupted_runs, incomplete_runs]
  failure_and_divergence_rules: Preserve every status; inspect Q scale, both TD residuals, agreement, gradients, and returns before any longer run.
  stopping_rules: Fixed at 5000 training environment steps per run; no outcome-dependent stopping.
  candidate_selection_rules: This one-seed screening can reject an unstable configuration but cannot establish superiority or select a confirmatory candidate.
