name: three_network_shared_d_synchronous
implementation_status: experimental
is_on_policy: false
uses_replay_buffer: true
supports_continuous_actions: true
critic_objective: shared_error
agreement_mode: both
alpha: 0.1
alpha_prime: 0.1
beta_regularizer:
  mode: none
  coefficient: 0.0
update_schedule: simultaneous
actor_state_source: next
critic_initialization: independent
actor_update_delay: 2
actor_learning_starts: 5000
# Q2 and Q1 gradients use the same pre-update minibatch snapshot. Both critic
# updates are committed before the slower Actor update. There are no target
# networks; D_prime remains diagnostic-only.
